<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu - Hệ thống thi thử THPTQG</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        background-color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .reset-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 420px;
        text-align: center;
        border: 1px solid #e2e8f0;
      }
      .reset-container h2 {
        color: #0284c7;
        font-weight: 900;
        font-size: 26px;
        margin-top: 0;
        margin-bottom: 5px;
      }
      .reset-container p {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .input-group {
        text-align: left;
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        color: #1e293b;
        margin-bottom: 5px;
      }
      .auth-input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        box-sizing: border-box;
        background: #f8fafc;
        transition: 0.2s;
      }
      .auth-input:focus {
        border-color: #0284c7;
        background: white;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
      }
      .btn-primary {
        background: #0284c7;
        color: white;
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: 8px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 10px;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(2, 132, 199, 0.3);
      }
      #error-message {
        display: none;
        color: #ef4444;
        background: #fef2f2;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #fca5a5;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
        font-size: 13px;
      }
      #success-area {
        display: none;
        color: #10b981;
        background: #ecfdf5;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #86efac;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .back-link {
        display: inline-block;
        margin-top: 15px;
        color: #0284c7;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="reset-container">
      <h2>ĐẶT LẠI MẬT KHẨU</h2>
      <p>Nhập mật khẩu mới cho tài khoản của bạn</p>

      <div id="error-message"></div>

      <div id="success-area">
        ✅ Đổi mật khẩu thành công!<br />
        <a href="index.html" class="back-link"
          >Quay lại trang chủ để Đăng nhập</a
        >
      </div>

      <div id="form-area">
        <div class="input-group">
          <label>MẬT KHẨU MỚI</label>
          <input
            type="password"
            id="new-password"
            class="auth-input"
            placeholder="..........."
            onkeypress="if(event.key === 'Enter') document.getElementById('btn-reset').click()"
          />
        </div>
        <div class="input-group">
          <label>XÁC NHẬN MẬT KHẨU MỚI</label>
          <input
            type="password"
            id="confirm-password"
            class="auth-input"
            placeholder="..........."
            onkeypress="if(event.key === 'Enter') document.getElementById('btn-reset').click()"
          />
        </div>

        <button id="btn-reset" class="btn-primary">
          LƯU MẬT KHẨU & ĐĂNG NHẬP
        </button>
      </div>
    </div>

    <div id="notification-modal" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <h3 id="notif-title">Thông báo</h3>
        <p id="notif-message">Nội dung thông báo...</p>
        <button id="notif-close-btn" onclick="window.closeNotificationModal()">
          Xác nhận
        </button>
      </div>
    </div>

    <script type="module">
      import { createSupabaseBrowserClient } from "./assets/js/config/supabase.shared.js";

      const supabase = createSupabaseBrowserClient("thpt_reset_temp_key", {
        storage: window.sessionStorage,
      });

      const formArea = document.getElementById("form-area");
      const errorEl = document.getElementById("error-message");
      const successArea = document.getElementById("success-area");
      const btnReset = document.getElementById("btn-reset");
      const newPassInput = document.getElementById("new-password");
      const confirmPassInput = document.getElementById("confirm-password");

      btnReset.addEventListener("click", async () => {
        const newPass = newPassInput.value.trim();
        const confirmPass = confirmPassInput.value.trim();

        errorEl.style.display = "none";

        if (!newPass || !confirmPass) {
          errorEl.innerText = "Vui lòng nhập đầy đủ mật khẩu!";
          errorEl.style.display = "block";
          return;
        }
        if (newPass.length < 6) {
          errorEl.innerText = "Mật khẩu phải từ 6 ký tự trở lên!";
          errorEl.style.display = "block";
          return;
        }
        if (newPass !== confirmPass) {
          errorEl.innerText = "Xác nhận mật khẩu không khớp!";
          errorEl.style.display = "block";
          return;
        }

        btnReset.innerText = "ĐANG LƯU MẬT KHẨU...";
        btnReset.disabled = true;
        btnReset.style.opacity = "0.7";

        try {
          const { error } = await supabase.auth.updateUser({
            password: newPass,
          });
          if (error) throw error;

          await supabase.auth.signOut();

          formArea.style.display = "none";
          successArea.style.display = "block";
        } catch (err) {
          // 👉 ĐÃ FIX: Bắt bệnh chính xác từng loại lỗi của Supabase
          let errorMsg = "Lỗi: Link khôi phục đã hết hạn hoặc không hợp lệ!";

          if (
            err.message &&
            (err.message.toLowerCase().includes("different") ||
              err.message.toLowerCase().includes("same"))
          ) {
            errorMsg = "Mật khẩu mới không được trùng với mật khẩu hiện tại!";
          } else if (
            err.message &&
            err.message.toLowerCase().includes("weak")
          ) {
            errorMsg = "Mật khẩu quá yếu, vui lòng chọn mật khẩu khác!";
          }

          errorEl.innerText = errorMsg;
          errorEl.style.display = "block";
          btnReset.innerText = "LƯU MẬT KHẨU & ĐĂNG NHẬP";
          btnReset.disabled = false;
          btnReset.style.opacity = "1";
        }
      });
    </script>
  </body>
</html>
